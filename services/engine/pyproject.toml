[project]
name = "adaptive-spot-lab-engine"
version = "0.0.1"
description = "Private paper-research account and funding API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx==0.28.1",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn>=0.30,<1",
  "websockets==17.0.1",
]

[dependency-groups]
dev = [
  "hypothesis>=6.168,<7",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
